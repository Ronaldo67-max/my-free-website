<!DOCTYPE html>
<html>
<head>
  <title>My Game</title>

  <style>
    body {
      margin: 0;
      background: white;
    }

    #player {
      width: 50px;
      height: 70px;
      background: blue;
      position: absolute;
      top: 50px;
      left: 50px;
    }
  </style>

</head>
<body>

  <div id="player"></div>

  <script>
    let x = 50;
    let y = 50;

    document.addEventListener("keydown", function(e) {
      if (e.key === "ArrowRight") x += 10;
      if (e.key === "ArrowLeft")  x -= 10;
      if (e.key === "ArrowDown")  y += 10;
      if (e.key === "ArrowUp")    y -= 10;

      const p = document.getElementById("player");
      p.style.left = x + "px";
      p.style.top  = y + "px";
    });
  </script>

</body>
</html>
