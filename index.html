<!DOCTYPE html>
<html>
<head>
  <title>My Game</title>
  <style>
    body {
      margin: 0;
      background: #87ceeb;
      overflow: hidden;
    }

    #player {
      position: absolute;
      width: 40px;
      height: 60px;
      background: red;
      left: 100px;
      bottom: 50px;
    }

    #ground {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 50px;
      background: green;
    }

    #text {
      position: fixed;
      top: 10px;
      left: 10px;
      font-family: Arial;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div id="text">Hold ⬅️ ➡️ | Press SPACE to jump</div>
  <div id="player"></div>
  <div id="ground"></div>

  <script>
    const player = document.getElementById("player");

    let x = 100;
    let y = 50;
    let velY = 0;
    let onGround = true;

    let keys = {};

    const gravity = 1;
    const jumpPower = 16;
    const speed = 5;

    window.addEventListener("keydown", e => {
      keys[e.key] = true;

      if (e.key === " " && onGround) {
        velY = jumpPower;
        onGround = false;
      }
    });

    window.addEventListener("keyup", e => {
      keys[e.key] = false;
    });

    function loop() {
      if (keys["ArrowRight"]) x += speed;
      if (keys["ArrowLeft"]) x -= speed;

      velY -= gravity;
      y += velY;

      if (y <= 50) {
        y = 50;
        velY = 0;
        onGround = true;
      }

      player.style.left = x + "px";
      player.style.bottom = y + "px";

      requestAnimationFrame(loop);
    }

    loop();
  </script>

</body>
</html>
