<!DOCTYPE html>
<html>
<head>
<title>My Game</title>
<style>
body{
  margin:0;
  background:#87ceeb;
  overflow:hidden;
  font-family:Arial;
}

#player{position:absolute;width:40px;height:60px;background:red;bottom:50px;}
.enemy{position:absolute;width:40px;height:40px;background:purple;bottom:50px;}
.bullet{position:absolute;width:10px;height:5px;background:black;}

#flag{position:absolute;width:30px;height:60px;background:gold;bottom:50px;}
.lava{
  position:absolute;
  height:20px;
  background:linear-gradient(red, orange, yellow);
  bottom:50px;
  animation: lavaMove 0.5s infinite alternate;
}

@keyframes lavaMove{
  from{filter:brightness(1);}
  to{filter:brightness(1.5);}
}

#checkpoint{
  position:absolute;
  width:30px;
  height:30px;
  background:blue;
  bottom:50px;
}

#ground{position:absolute;bottom:0;width:100%;height:50px;background:green;}

#hud{
  position:fixed;
  top:10px;
  left:10px;
  font-size:16px;
}

#gameover{
  position:fixed;
  inset:0;
  background:black;
  color:white;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  font-size:32px;
}

button{font-size:20px;margin:5px;padding:10px;}
</style>
</head>

<body>

<div id="hud">
❤️ Lives: <span id="lives">5</span><br>
⭐ Score: <span id="score">0</span><br>
🧭 Level: <span id="level">1</span>
</div>

<button onclick="keys.ArrowLeft=true">⬅️</button>
<button onclick="jump()">⤴️</button>
<button onclick="keys.ArrowRight=true">➡️</button>

<div id="player"></div>
<div id="flag"></div>
<div id="checkpoint"></div>
<div id="ground"></div>

<div id="gameover">
  💀 GAME OVER 💀<br><br>
  <button onclick="restartGame()">Restart</button>
</div>

<script>
const player=document.getElementById("player");
const flag=document.getElementById("flag");
const checkpoint=document.getElementById("checkpoint");
const gameover=document.getElementById("gameover");

const livesText=document.getElementById("lives");
const scoreText=document.getElementById("score");
const levelText=document.getElementById("level");

let spawnX=100,spawnY=50;
let x=spawnX,y=spawnY,velY=0,onGround=true;
let lives=5,score=0,level=1;
let enemies=[],lavas=[];
const keys={};

const gravity=1,jumpPower=16,speed=5;

function hit(a,b){
  return !(a.right<b.left||a.left>b.right||a.bottom<b.top||a.top>b.bottom);
}

function jump(){
  if(onGround){velY=jumpPower;onGround=false;}
}

function resetLevel(){
  x=spawnX;y=spawnY;velY=0;

  enemies.forEach(e=>e.remove());
  lavas.forEach(l=>l.remove());
  enemies=[];lavas=[];

  // enemies
  for(let i=0;i<level;i++){
    const e=document.createElement("div");
    e.className="enemy";
    e.style.left=(300+i*200)+"px";
    e.dir=1;
    document.body.appendChild(e);
    enemies.push(e);
  }

  // lava pits
  for(let i=0;i<level;i++){
    const lava=document.createElement("div");
    lava.className="lava";
    lava.style.left=(200+i*300)+"px";
    lava.style.width="120px";
    document.body.appendChild(lava);
    lavas.push(lava);
  }

  // checkpoint
  checkpoint.style.left="500px";

  // flag
  flag.style.left=(innerWidth-60)+"px";
}

function restartGame(){
  lives=5;
  score=0;
  level=1;
  spawnX=100;
  gameover.style.display="none";
  resetLevel();
}

resetLevel();

function loop(){
  if(keys.ArrowLeft) x-=speed;
  if(keys.ArrowRight) x+=speed;

  velY-=gravity;
  y+=velY;
  if(y<=50){y=50;velY=0;onGround=true;}

  const p={left:x,right:x+40,top:y+60,bottom:y};

  // 🔥 LAVA
  lavas.forEach(l=>{
    const lx=parseInt(l.style.left);
    const lb={left:lx,right:lx+120,top:70,bottom:50};
    if(hit(p,lb)){
      lives--;
      resetLevel();
    }
  });

  // 👹 MOVING ENEMIES
  enemies.forEach(e=>{
    let ex=parseInt(e.style.left);
    ex+=e.dir*2;
    if(ex<100||ex>innerWidth-100) e.dir*=-1;
    e.style.left=ex+"px";

    const eb={left:ex,right:ex+40,top:90,bottom:50};
    if(hit(p,eb)){
      lives--;
      resetLevel();
    }
  });

  // 🔵 CHECKPOINT
  const cx=parseInt(checkpoint.style.left);
  const cb={left:cx,right:cx+30,top:80,bottom:50};
  if(hit(p,cb)){
    spawnX=cx;
    checkpoint.style.background="lightblue";
  }

  // 🏁 FLAG
  const fx=parseInt(flag.style.left);
  const fb={left:fx,right:fx+30,top:110,bottom:50};
  if(hit(p,fb)){
    level++;
    score+=500;
    spawnX=100;
    resetLevel();
  }

  // ☠️ GAME OVER
  if(lives<=0){
    gameover.style.display="flex";
    return;
  }

  player.style.left=x+"px";
  player.style.bottom=y+"px";

  livesText.textContent=lives;
  scoreText.textContent=score;
  levelText.textContent=level;

  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
