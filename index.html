<!DOCTYPE html>
<html>
<head>
  <title>My First Game</title>
  <style>
    body {
      margin: 0;
      background: #87ceeb;
      overflow: hidden;
    }

    #player {
      position: absolute;
      width: 40px;
      height: 60px;
      background: red;
      left: 100px;
      bottom: 50px;
    }

    #ground {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 50px;
      background: green;
    }

    #hint {
      position: fixed;
      top: 10px;
      left: 10px;
      color: black;
      font-family: Arial;
      font-size: 16px;
    }
  </style>
</head>

<body tabindex="0">

  <div id="hint">Click the screen, then use ⬅️ ➡️ and SPACE</div>
  <div id="player"></div>
  <div id="ground"></div>
