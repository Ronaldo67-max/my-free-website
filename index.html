<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WORKING GAME FINAL</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:#87ceeb;
  font-family:Arial;
}

/* PLAYER */
#player{
  position:absolute;
  width:40px;
  height:60px;
  background:red;
  left:100px;
  bottom:50px;
}

/* LAVA */
#lava{
  position:absolute;
  width:80px;          /* 🔥 SHORTER LAVA */
  height:25px;
  background:orange;
  bottom:50px;
}

/* FLAG */
#flag{
  position:absolute;
  width:40px;
  height:80px;
  background:gold;
  bottom:50px;
}

/* GROUND */
#ground{
  position:absolute;
  bottom:0;
  width:100%;
  height:50px;
  background:green;
}

/* HUD */
#hud{
  position:fixed;
  top:10px;
  left:10px;
  font-size:20px;
}
</style>
</head>

<body>

<div id="hud">
Lives: <span id="lives">3</span> |
Level: <span id="level">1</span>
</div>

<div id="player"></div>
<div id="lava"></div>
<div id="flag"></div>
<div id="ground"></div>

<script>
/* ===== VARIABLES ===== */
const player = document.getElementById("player");
const lava = document.getElementById("lava");
const flag = document.getElementById("flag");
const livesText = document.getElementById("lives");
const levelText = document.getElementById("level");

let x = 100;
let y = 50;
let velY = 0;
let onGround = true;

let lives = 3;
let level = 1;

let left = false;
let right = false;

const gravity = 0.9;
const speed = 5;
const jumpPower = 15;

/* ===== CONTROLS ===== */
document.addEventListener("keydown", e=>{
  if(e.key === "ArrowLeft") left = true;
  if(e.key === "ArrowRight") right = true;
  if(e.key === " " || e.key === "ArrowUp") jump();
});

document.addEventListener("keyup", e=>{
  if(e.key === "ArrowLeft") left = false;
  if(e.key === "ArrowRight") right = false;
});

/* ===== FUNCTIONS ===== */
function jump(){
  if(onGround){
    velY = jumpPower;
    onGround = false;
  }
}

function rect(el){
  return el.getBoundingClientRect();
}

function collide(a,b){
  return !(
    a.right < b.left ||
    a.left > b.right ||
    a.bottom < b.top ||
    a.top > b.bottom
  );
}

function die(){
  lives--;
  if(lives <= 0){
    alert("GAME OVER");
    lives = 3;
    level = 1;
  }
  reset();
}

function reset(){
  x = 100;
  y = 50;
  velY = 0;

  /* LEVEL SCALING */
  lava.style.left = (250 + level * 60) + "px";
  lava.style.width = (60 + level * 10) + "px"; // 🔥 grows slowly
  flag.style.left = (500 + level * 80) + "px";
}

/* ===== GAME LOOP ===== */
function loop(){
  /* Movement */
  if(left) x -= speed;
  if(right) x += speed;

  /* Gravity */
  velY -= gravity;
  y += velY;

  if(y <= 50){
    y = 50;
    velY = 0;
    onGround = true;
  }

  /* Apply position */
  player.style.left = x + "px";
  player.style.bottom = y + "px";

  /* Collisions */
  const p = rect(player);
  const l = rect(lava);
  const f = rect(flag);

  /* Lava = death */
  if(collide(p,l)){
    die();
  }

  /* Flag = next level */
  if(collide(p,f)){
    level++;
    reset();
  }

  livesText.textContent = lives;
  levelText.textContent = level;

  requestAnimationFrame(loop);
}

/* START GAME */
reset();
loop();
</script>

</body>
</html>
