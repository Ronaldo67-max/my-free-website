<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WORKING GAME FINAL</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:#87ceeb;
  font-family:Arial;
}

/* PLAYER */
#player{
  position:absolute;
  width:40px;
  height:60px;
  background:red;
  left:100px;
  bottom:50px;
}

/* LAVA */
#lava{
  position:absolute;
  width:200px;
  height:25px;
  background:orange;
  left:300px;
  bottom:50px;
}

/* FLAG */
#flag{
  position:absolute;
  width:60px;
  height:80px;
  background:gold;
  left:650px;
  bottom:50px;
}

/* GROUND */
#ground{
  position:absolute;
  bottom:0;
  width:100%;
  height:50px;
  background:green;
}

/* HUD */
#hud{
  position:fixed;
  top:10px;
  left:10px;
  font-size:20px;
}

/* BUTTONS */
#controls{
  position:fixed;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
}
button{
  font-size:26px;
  padding:15px;
}
</style>
</head>

<body>

<div id="hud">
Lives: <span id="lives">3</span> |
Level: <span id="level">1</span>
</div>

<div id="controls">
  <button id="left">⬅️</button>
  <button id="jump">⤴️</button>
  <button id="right">➡️</button>
</div>

<div id="player"></div>
<div id="lava"></div>
<div id="flag"></div>
<div id="ground"></div>

<script>
/* ===== VARIABLES ===== */
const player = document.getElementById("player");
const lava = document.getElementById("lava");
const flag = document.getElementById("flag");
const livesText = document.getElementById("lives");
const levelText = document.getElementById("level");

let x = 100;
let y = 50;
let velY = 0;
let onGround = true;

let lives = 3;
let level = 1;

let goLeft = false;
let goRight = false;

const gravity = 1;
const speed = 5;
const jumpPower = 15;

/* ===== CONTROLS ===== */
document.addEventListener("keydown", e=>{
  if(e.key==="ArrowLeft") goLeft = true;
  if(e.key==="ArrowRight") goRight = true;
  if(e.key===" ") jump();
});

document.addEventListener("keyup", e=>{
  if(e.key==="ArrowLeft") goLeft = false;
  if(e.key==="ArrowRight") goRight = false;
});

left.onmousedown = ()=> goLeft = true;
left.onmouseup = ()=> goLeft = false;
left.ontouchstart = ()=> goLeft = true;
left.ontouchend = ()=> goLeft = false;

right.onmousedown = ()=> goRight = true;
right.onmouseup = ()=> goRight = false;
right.ontouchstart = ()=> goRight = true;
right.ontouchend = ()=> goRight = false;

jump.onclick = jump;
jump.ontouchstart = jump;

/* ===== FUNCTIONS ===== */
function jump(){
  if(onGround){
    velY = jumpPower;
    onGround = false;
  }
}

function box(el){
  return el.getBoundingClientRect();
}

function die(){
  lives--;
  alert("YOU DIED");
  if(lives <= 0){
    alert("GAME OVER");
    lives = 3;
    level = 1;
  }
  reset();
}

function reset(){
  x = 100;
  y = 50;
  velY = 0;

  lava.style.left = (300 + level*30) + "px";
  flag.style.left = (600 + level*20) + "px";
}

/* ===== GAME LOOP ===== */

  if(goLeft) x -= speed;
  if(goRight) x += speed;

  velY -= gravity;
  y += velY;

  if(y <= 50){
    y = 50;
    velY = 0;
    onGround = true;
  }

  player.style.left = x + "px";
  player.style.bottom = y + "px";

  const l = box(lava);
  const f = box(flag);

    die();
  }
