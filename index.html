<!DOCTYPE html>
<html>
<head>
<title>Working Platformer</title>

<style>
html,body{
  margin:0;
  padding:0;
  overflow:hidden;
  background:#87ceeb;
  font-family:Arial;
}

#player{
  position:absolute;
  width:40px;
  height:60px;
  background:red;
  left:100px;
  bottom:50px;
}

.enemy{
  position:absolute;
  width:40px;
  height:40px;
  background:purple;
  bottom:50px;
}

.lava{
  position:absolute;
  width:120px;
  height:20px;
  background:orangered;
  bottom:50px;
}

#flag{
  position:absolute;
  width:30px;
  height:60px;
  background:gold;
  bottom:50px;
}

#ground{
  position:absolute;
  bottom:0;
  width:100%;
  height:50px;
  background:green;
}

#hud{
  position:fixed;
  top:10px;
  left:10px;
  color:black;
  font-size:16px;
}

button{
  position:fixed;
  bottom:10px;
  font-size:20px;
  padding:10px;
}

#leftBtn{left:10px;}
#jumpBtn{left:80px;}
#rightBtn{left:150px;}
</style>
</head>

<body>

<div id="hud">
Lives: <span id="lives">3</span> |
Level: <span id="level">1</span>
</div>

<button id="leftBtn">⬅️</button>
<button id="jumpBtn">⤴️</button>
<button id="rightBtn">➡️</button>

<div id="player"></div>
<div id="flag"></div>
<div id="ground"></div>

<script>
/* ========= VARIABLES ========= */
const player=document.getElementById("player");
const flag=document.getElementById("flag");
const livesText=document.getElementById("lives");
const levelText=document.getElementById("level");

let x=100,y=50;
let velY=0;
let onGround=true;

let lives=3;
let level=1;

let moveLeft=false;
let moveRight=false;

const gravity=1;
const speed=5;
const jumpPower=16;

/* ========= CONTROLS ========= */
// Disable scrolling
window.addEventListener("keydown",e=>e.preventDefault());

// Keyboard
window.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft"||e.key==="a") moveLeft=true;
  if(e.key==="ArrowRight"||e.key==="d") moveRight=true;
  if(e.key===" "||e.key==="ArrowUp") jump();
});

window.addEventListener("keyup",e=>{
  if(e.key==="ArrowLeft"||e.key==="a") moveLeft=false;
  if(e.key==="ArrowRight"||e.key==="d") moveRight=false;
});

// Buttons
leftBtn.onmousedown=()=>moveLeft=true;
leftBtn.onmouseup=()=>moveLeft=false;
rightBtn.onmousedown=()=>moveRight=true;
rightBtn.onmouseup=()=>moveRight=false;
jumpBtn.onclick=jump;

/* ========= FUNCTIONS ========= */
function jump(){
  if(onGround){
    velY=jumpPower;
    onGround=false;
  }
}

function hit(a,b){
  return !(a.right<b.left||a.left>b.right||a.bottom<b.top||a.top>b.bottom);
}

function resetLevel(){
  x=100;
  y=50;
  velY=0;
  flag.style.left=(innerWidth-60)+"px";
}

/* ========= GAME LOOP ========= */
function loop(){
  // Movement
  if(moveLeft) x-=speed;
  if(moveRight) x+=speed;

  // Gravity
  velY-=gravity;
  y+=velY;

  if(y<=50){
    y=50;
    velY=0;
    onGround=true;
  }

  // Player box
  const p={left:x,right:x+40,top:y+60,bottom:y};

  // Flag
  const fx=parseInt(flag.style.left)||innerWidth-60;
  const f={left:fx,right:fx+30,top:110,bottom:50};

  if(hit(p,f)){
    level++;
    levelText.textContent=level;
    resetLevel();
  }

  // Apply position
  player.style.left=x+"px";
  player.style.bottom=y+"px";

  livesText.textContent=lives;

  requestAnimationFrame(loop);
}

resetLevel();
loop();
</script>

</body>
</html>
