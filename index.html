<!DOCTYPE html>
<html>
<head>
  <title>Jump Game</title>

  <style>
    body {
      margin: 0;
      background: #eaeaea;
      overflow: hidden;
    }

    #player {
      width: 50px;
      height: 70px;
      background: blue;
      position: absolute;
      left: 50px;
      bottom: 0;
    }

    #ground {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 40px;
      background: green;
    }
  </style>
</head>

<body>

  <div id="player"></div>
  <div id="ground"></div>

  <script>
    let x = 50;
    let y = 0;
    let velocityY = 0;
    let isJumping = false;
    const gravity = 1;

    function gameLoop() {
      velocityY += gravity;
      y -= velocityY;

      if (y < 0) {
        y = 0;
        velocityY = 0;
        isJumping = false;
      }

      const player = document.getElementById("player");
      player.style.left = x + "px";
      player.style.bottom = y + "px";

      requestAnimationFrame(gameLoop);
    }

    document.addEventListener("keydown", function(e) {
      if (e.key === "ArrowRight") x += 10;
      if (e.key === "ArrowLeft")  x -= 10;

      if (e.key === " " && !isJumping) {
        velocityY = -20;
        isJumping = true;
      }
    });

    gameLoop();
  </script>

</body>
</html>
