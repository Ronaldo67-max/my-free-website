<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WORKING GAME FINAL</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:#87ceeb;
  font-family:Arial;
}

/* PLAYER */
#player{
  position:absolute;
  width:40px;
  height:60px;
  background:red;
  bottom:50px;
}

/* ENEMY */
.enemy{
  position:absolute;
  width:40px;
  height:40px;
  background:purple;
  bottom:50px;
}

/* BOSS */
#boss{
  position:absolute;
  width:80px;
  height:80px;
  background:darkred;
  bottom:50px;
  display:none;
}

/* BULLET */
.bullet{
  position:absolute;
  width:10px;
  height:5px;
  background:black;
}

/* LAVA */
#lava{
  position:absolute;
  height:25px;
  background:orange;
  bottom:50px;
}

/* FLAG */
#flag{
  position:absolute;
  width:40px;
  height:80px;
  background:gold;
  bottom:50px;
}

/* GROUND */
#ground{
  position:absolute;
  bottom:0;
  width:100%;
  height:50px;
  background:green;
}

/* HUD */
#hud{
  position:fixed;
  top:10px;
  left:10px;
  font-size:18px;
}
</style>
</head>

<body>

<div id="hud">
Lives: <span id="lives">3</span> |
Level: <span id="level">1</span>
</div>

<div id="player"></div>
<div id="lava"></div>
<div id="flag"></div>
<div id="boss"></div>
<div id="ground"></div>

<script>
/* ===== VARIABLES ===== */
const player=document.getElementById("player");
const lava=document.getElementById("lava");
const flag=document.getElementById("flag");
const boss=document.getElementById("boss");
const livesText=document.getElementById("lives");
const levelText=document.getElementById("level");

let x=100,y=50,velY=0,onGround=true;
let lives=3,level=1;
let facing=1; // 👉 1 = right, -1 = left

let enemies=[];
let bullets=[];
let bossHP=0;

const gravity=0.9,speed=5,jumpPower=15;

/* ===== CONTROLS ===== */
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft"){x-=speed;facing=-1;}
  if(e.key==="ArrowRight"){x+=speed;facing=1;}
  if(e.key===" "||e.key==="ArrowUp") jump();
  if(e.key==="f") shoot();
});

/* ===== FUNCTIONS ===== */
function jump(){
  if(onGround){
    velY=jumpPower;
    onGround=false;
  }
}

function shoot(){
  bullets.push({
    x:x+20,
    y:y+30,
    dir:facing
  });
}

function rect(el){
  return el.getBoundingClientRect();
}

function collide(a,b){
  return !(a.right<b.left||a.left>b.right||a.bottom<b.top||a.top>b.bottom);
}

function die(){
  lives--;
  if(lives<=0){
    alert("GAME OVER");
    lives=3;
    level=1;
  }
  resetLevel();
}

function resetLevel(){
  x=100;y=50;velY=0;
  bullets.forEach(b=>b.el?.remove());
  bullets=[];
  enemies.forEach(e=>e.remove());
  enemies=[];

  lava.style.left=(200+Math.random()*300)+"px";
  lava.style.width=(80+level*10)+"px";
  flag.style.left=(500+Math.random()*200)+"px";

  boss.style.display="none";
  bossHP=0;

  if(level%10===0){
    boss.style.display="block";
    boss.style.left="600px";
    bossHP=10+level;
  }else{
    for(let i=0;i<level;i++){
      const e=document.createElement("div");
      e.className="enemy";
      e.style.left=(300+i*120)+"px";
      document.body.appendChild(e);
      enemies.push(e);
    }
  }
}

/* ===== GAME LOOP ===== */
function loop(){
  velY-=gravity;
  y+=velY;
  if(y<=50){y=50;velY=0;onGround=true;}

  player.style.left=x+"px";
  player.style.bottom=y+"px";

  const p=rect(player);

  // Lava
  if(collide(p,rect(lava))) die();

  // Flag
  if(collide(p,rect(flag))){
    level++;
    resetLevel();
  }

  // Bullets
  bullets.forEach((b,i)=>{
    b.x+=b.dir*8;
    if(!b.el){
      b.el=document.createElement("div");
      b.el.className="bullet";
      document.body.appendChild(b.el);
    }
    b.el.style.left=b.x+"px";
    b.el.style.bottom=b.y+"px";

    enemies.forEach((e,ei)=>{
      if(collide(b.el.getBoundingClientRect(),e.getBoundingClientRect())){
        e.remove();
        enemies.splice(ei,1);
        b.el.remove();
        bullets.splice(i,1);
      }
    });

    if(boss.style.display==="block" &&
       collide(b.el.getBoundingClientRect(),boss.getBoundingClientRect())){
      bossHP--;
      b.el.remove();
      bullets.splice(i,1);
      if(bossHP<=0){
        boss.style.display="none";
        level++;
        resetLevel();
      }
    }
  });

  livesText.textContent=lives;
  levelText.textContent=level;

  requestAnimationFrame(loop);
}

/* START */
resetLevel();
loop();
</script>

</body>
</html>
