<!DOCTYPE html>
<html>
<head>
  <title>My Real Game</title>
  <style>
    body {
      background: white;
      margin: 0;
    }

    #player {
      width: 80px;
      height: 80px;
      background: blue;
      border: 4px solid black;
      position: absolute;
      top: 50px;
      left: 50px;
    }
  </style>
</head>

<body>

  <div id="player"></div>

  <script>
    let x = 50;
    let y = 50;

    document.addEventListener("keydown", function(event) {
      if (event.key === "ArrowRight") x += 10;
      if (event.key === "ArrowLeft")  x -= 10;
      if (event.key === "ArrowDown")  y += 10;
      if (event.key === "ArrowUp")    y -= 10;

      document.getElementById("player").style.left = x + "px";
      document.getElementById("player").style.top  = y + "px";
    });
  </script>

</body>
</html>
