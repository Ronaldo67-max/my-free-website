<!DOCTYPE html>
<html>
<head>
  <title>My First Game</title>
  <style>
    body {
      text-align: center;
      font-family: Arial;
      background: #111;
      color: white;
    }
    button {
      font-size: 24px;
      padding: 20px;
      margin-top: 50px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Click the Button Game 🎮</h1>
  <p>Score: <span id="score">0</span></p>

  <button onclick="addPoint()">CLICK ME</button>

  <script>
    let score = 0;
    function addPoint() {
      score++;
      document.getElementById("score").innerText = score;
    }
  </script>

</body>
</html>
