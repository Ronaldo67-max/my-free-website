<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>RANDOM PLATFORMER</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:#87ceeb;
  font-family:Arial;
}

#player{
  position:absolute;
  width:40px;
  height:60px;
  background:red;
  bottom:50px;
  left:100px;
}

.enemy{
  position:absolute;
  width:40px;
  height:40px;
  background:purple;
  bottom:50px;
}

.boss{
  position:absolute;
  width:90px;
  height:90px;
  background:black;
  bottom:50px;
}

.bullet{
  position:absolute;
  width:10px;
  height:5px;
  background:black;
}

.lava{
  position:absolute;
  height:25px;
  background:orange;
  bottom:50px;
}

#flag{
  position:absolute;
  width:40px;
  height:80px;
  background:gold;
  bottom:50px;
}

#ground{
  position:absolute;
  bottom:0;
  width:100%;
  height:50px;
  background:green;
}

#hud{
  position:fixed;
  top:10px;
  left:10px;
  font-size:20px;
}
</style>
</head>

<body>

<div id="hud">
Lives: <span id="lives">3</span> |
Level: <span id="level">1</span>
</div>

<div id="player"></div>
<div id="flag"></div>
<div id="ground"></div>

<script>
const player=document.getElementById("player");
const flag=document.getElementById("flag");
const livesText=document.getElementById("lives");
const levelText=document.getElementById("level");

let x=100,y=50,velY=0,onGround=true;
let lives=3,level=1;
let moveLeft=false,moveRight=false,facing=1;

let bullets=[],enemies=[],lavas=[];
let boss=null,bossHP=0;

const gravity=0.9,speed=5,jumpPower=15;

/* CONTROLS */
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft"){moveLeft=true;facing=-1;}
  if(e.key==="ArrowRight"){moveRight=true;facing=1;}
  if(e.key===" "||e.key==="ArrowUp") jump();
  if(e.key==="f"||e.key==="F") shoot();
});
document.addEventListener("keyup",e=>{
  if(e.key==="ArrowLeft") moveLeft=false;
  if(e.key==="ArrowRight") moveRight=false;
});

function jump(){
  if(onGround){velY=jumpPower;onGround=false;}
}

function rect(el){return el.getBoundingClientRect();}
function hit(a,b){return !(a.right<b.left||a.left>b.right||a.bottom<b.top||a.top>b.bottom);}

function shoot(){
  const b=document.createElement("div");
  b.className="bullet";
  b.x=x+20;
  b.y=y+30;
  b.dir=facing;
  document.body.appendChild(b);
  bullets.push(b);
}

function die(){
  lives--;
  if(lives<=0){
    alert("GAME OVER");
    lives=3;
    level=1;
  }
  buildLevel();
}

/* 🔥 RANDOM LEVEL GENERATION */
function buildLevel(){
  x=100;y=50;velY=0;
  bullets.forEach(b=>b.remove());
  enemies.forEach(e=>e.remove());
  lavas.forEach(l=>l.remove());
  bullets=[];enemies=[];lavas=[];
  if(boss){boss.remove();boss=null;}

  /* Random lava */
  const lavaCount=Math.min(1+Math.floor(level/2),5);
  for(let i=0;i<lavaCount;i++){
    const l=document.createElement("div");
    l.className="lava";
    l.style.left=(200+Math.random()*800)+"px";
    l.style.width=(60+Math.random()*60+level*5)+"px";
    document.body.appendChild(l);
    lavas.push(l);
  }

  if(level%10===0){
    boss=document.createElement("div");
    boss.className="boss";
    boss.style.left="600px";
    document.body.appendChild(boss);
    bossHP=5+Math.floor(level/2);
    flag.style.display="none";
  }else{
    const enemyCount=Math.min(level+1,8);
    for(let i=0;i<enemyCount;i++){
      const e=document.createElement("div");
      e.className="enemy";
      e.style.left=(300+Math.random()*800)+"px";
      document.body.appendChild(e);
      enemies.push(e);
    }
    flag.style.display="block";
    flag.style.left=(900+Math.random()*300)+"px";
  }
}

/* GAME LOOP */
function loop(){
  if(moveLeft)x-=speed;
  if(moveRight)x+=speed;

  velY-=gravity;
  y+=velY;
  if(y<=50){y=50;velY=0;onGround=true;}

  player.style.left=x+"px";
  player.style.bottom=y+"px";

  const p=rect(player);

  /* Lava */
  lavas.forEach(l=>{
    if(hit(p,rect(l))) die();
  });

  /* Bullets */
  bullets.forEach((b,i)=>{
    b.x+=b.dir*10;
    b.style.left=b.x+"px";
    b.style.bottom=b.y+"px";

    enemies.forEach((e,ei)=>{
      if(hit(rect(b),rect(e))){
        e.remove();enemies.splice(ei,1);
        b.remove();bullets.splice(i,1);
      }
    });

    if(boss && hit(rect(b),rect(boss))){
      bossHP--;
      b.remove();bullets.splice(i,1);
      if(bossHP<=0){
        boss.remove();boss=null;
        level++;buildLevel();
      }
    }
  });

  enemies.forEach(e=>{
    if(hit(p,rect(e))) die();
  });

  if(!boss && enemies.length===0 && hit(p,rect(flag))){
    level++;buildLevel();
  }

  livesText.textContent=lives;
  levelText.textContent=level;

  requestAnimationFrame(loop);
}

/* START */
buildLevel();
loop();
</script>

</body>
</html>
